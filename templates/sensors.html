<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>IndustrialIQ — Sensor Encyclopedia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
[data-theme="dark"]{--bg:#0b0f1a;--bg2:#111827;--bg3:#1a2236;--bg4:#202d44;--card:#131d2e;--card2:#172035;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);--text:#f0f4ff;--text2:#94a3c0;--text3:#4d6080;--shadow:0 4px 32px rgba(0,0,0,0.5);--scrollbar:rgba(255,255,255,0.1);--input-bg:rgba(255,255,255,0.04)}
[data-theme="light"]{--bg:#f0f4ff;--bg2:#ffffff;--bg3:#e8edf8;--bg4:#d8e0f0;--card:#ffffff;--card2:#f5f8ff;--border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.15);--text:#0f1729;--text2:#4a5878;--text3:#8899bb;--shadow:0 4px 24px rgba(15,23,42,0.1);--scrollbar:rgba(0,0,0,0.12);--input-bg:rgba(0,0,0,0.03)}
:root{--accent:#4f7cff;--accent2:#7aa2ff;--adim:rgba(79,124,255,0.12);--adim2:rgba(79,124,255,0.22);--green:#10d98a;--gdim:rgba(16,217,138,0.12);--yellow:#f5c518;--ydim:rgba(245,197,24,0.12);--orange:#ff7c2a;--odim:rgba(255,124,42,0.12);--red:#ff3b5c;--rdim:rgba(255,59,92,0.12);--teal:#06c8d0;--tdim:rgba(6,200,208,0.12);--purple:#a855f7;--mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif;--r:12px;--rl:18px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button{font-family:var(--sans);cursor:pointer;border:none;background:none}
a{text-decoration:none;color:inherit}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:4px}

.app{display:grid;grid-template-rows:60px 1fr;height:100vh;overflow:hidden}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:var(--bg2);border-bottom:1px solid var(--border);position:relative;z-index:20;box-shadow:var(--shadow)}
.topbar-logo{display:flex;align-items:center;gap:12px}
.logo-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;letter-spacing:.04em;box-shadow:0 0 20px rgba(79,124,255,0.45);flex-shrink:0}
.logo-name{font-size:17px;font-weight:800;letter-spacing:-.01em}
.logo-name span{color:var(--accent2)}
.logo-sub{font-size:9px;color:var(--text3);font-family:var(--mono);letter-spacing:.12em;margin-top:1px}
.topbar-nav{display:flex;align-items:center;gap:4px}
.nav-tab{padding:7px 16px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text3);cursor:pointer;transition:all .18s;border:1px solid transparent}
.nav-tab:hover{color:var(--text2);background:var(--bg3)}
.nav-tab.active{color:var(--accent2);background:var(--adim);border-color:rgba(79,124,255,.25)}
.topbar-right{display:flex;align-items:center;gap:14px}
.theme-toggle{width:40px;height:22px;border-radius:11px;border:1px solid var(--border2);background:var(--bg3);cursor:pointer;position:relative;transition:background .3s;flex-shrink:0}
.theme-toggle-knob{width:16px;height:16px;border-radius:50%;position:absolute;top:2px;background:linear-gradient(135deg,var(--accent),var(--purple));transition:left .3s;left:2px}
[data-theme="light"] .theme-toggle-knob{left:20px}
.theme-toggle-icon{font-size:10px;position:absolute;top:50%;transform:translateY(-50%)}
.theme-toggle-icon.moon{left:5px}
.theme-toggle-icon.sun{right:5px}

/* MAIN CONTENT */
.main-content{overflow-y:auto;padding:0}

/* HERO */
.hero{padding:40px 48px 30px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(79,124,255,0.08) 0%,transparent 70%);pointer-events:none}
.hero-title{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.hero-title span{background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-sub{font-size:14px;color:var(--text3);max-width:600px;margin:0 auto;line-height:1.7;font-family:var(--mono)}

/* MACHINE TABS */
.machine-tabs{display:flex;gap:8px;padding:0 48px 24px;overflow-x:auto;justify-content:center;flex-wrap:wrap}
.machine-tab{display:flex;align-items:center;gap:10px;padding:12px 20px;border-radius:var(--r);border:1px solid var(--border);background:var(--card);cursor:pointer;transition:all .25s;white-space:nowrap}
.machine-tab:hover{border-color:var(--border2);background:var(--bg4);transform:translateY(-2px);box-shadow:var(--shadow)}
.machine-tab.active{border-color:rgba(79,124,255,.5);background:var(--adim);box-shadow:0 0 24px rgba(79,124,255,0.15)}
.machine-tab .mt-ico{font-size:24px}
.machine-tab .mt-name{font-size:13px;font-weight:600}
.machine-tab .mt-cnt{font-size:9px;font-family:var(--mono);color:var(--text3);background:var(--bg3);padding:2px 8px;border-radius:10px;letter-spacing:.1em}
.machine-tab.active .mt-cnt{color:var(--accent2);background:rgba(79,124,255,0.15)}

/* SENSOR DISPLAY */
.sensor-display{padding:0 48px 48px;max-width:1200px;margin:0 auto;width:100%}
.machine-header{display:flex;align-items:center;gap:16px;margin-bottom:24px;padding:20px 24px;background:var(--card);border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--shadow);animation:fadeUp .4s ease}
.mh-icon{font-size:42px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;background:var(--adim);border-radius:var(--r);border:1px solid rgba(79,124,255,.2)}
.mh-info h2{font-size:22px;font-weight:700;margin-bottom:4px}
.mh-info p{font-size:12px;color:var(--text3);font-family:var(--mono);letter-spacing:.04em}
.mh-stats{margin-left:auto;display:flex;gap:16px}
.mh-stat{text-align:center}
.mh-stat-val{font-size:24px;font-weight:800;font-family:var(--mono);color:var(--accent2)}
.mh-stat-lbl{font-size:9px;color:var(--text3);font-family:var(--mono);letter-spacing:.12em;margin-top:2px}

/* SENSOR CARDS GRID */
.sensor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.sensor-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;box-shadow:var(--shadow);transition:all .3s;animation:fadeUp .4s ease backwards;position:relative}
.sensor-card:nth-child(1){animation-delay:.05s}
.sensor-card:nth-child(2){animation-delay:.1s}
.sensor-card:nth-child(3){animation-delay:.15s}
.sensor-card:nth-child(4){animation-delay:.2s}
.sensor-card:nth-child(5){animation-delay:.25s}
.sensor-card:nth-child(6){animation-delay:.3s}
.sensor-card:hover{border-color:rgba(79,124,255,.35);transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,0.4)}
.sensor-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--purple));opacity:0;transition:opacity .3s}
.sensor-card:hover::before{opacity:1}

.sc-header{padding:18px 20px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
.sc-icon{font-size:28px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:var(--r);flex-shrink:0}
.sc-icon.temp{background:rgba(255,59,92,0.1);border:1px solid rgba(255,59,92,0.2)}
.sc-icon.vib{background:rgba(255,124,42,0.1);border:1px solid rgba(255,124,42,0.2)}
.sc-icon.current{background:rgba(245,197,24,0.1);border:1px solid rgba(245,197,24,0.2)}
.sc-icon.rpm{background:rgba(79,124,255,0.1);border:1px solid rgba(79,124,255,0.2)}
.sc-icon.pressure{background:rgba(6,200,208,0.1);border:1px solid rgba(6,200,208,0.2)}
.sc-icon.flow{background:rgba(16,217,138,0.1);border:1px solid rgba(16,217,138,0.2)}
.sc-icon.weight{background:rgba(168,85,247,0.1);border:1px solid rgba(168,85,247,0.2)}
.sc-icon.speed{background:rgba(79,124,255,0.1);border:1px solid rgba(79,124,255,0.2)}
.sc-title{font-size:15px;font-weight:700}
.sc-unit{font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:2px}

.sc-body{padding:16px 20px}
.sc-purpose{margin-bottom:14px}
.sc-purpose-lbl{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent2);font-family:var(--mono);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.sc-purpose-lbl::before{content:'';width:8px;height:2px;background:var(--accent);border-radius:1px}
.sc-purpose-txt{font-size:13px;color:var(--text2);line-height:1.6}

.sc-importance{background:var(--input-bg);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px}
.sc-imp-lbl{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--yellow);font-family:var(--mono);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sc-imp-lbl::before{content:'';width:8px;height:2px;background:var(--yellow);border-radius:1px}
.sc-imp-item{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;font-size:12px;color:var(--text2);line-height:1.5}
.sc-imp-item:last-child{margin-bottom:0}
.sc-imp-dot{width:5px;height:5px;border-radius:50%;background:var(--green);flex-shrink:0;margin-top:6px}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* BACK LINK */
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text3);font-family:var(--mono);padding:6px 14px;border:1px solid var(--border);border-radius:8px;transition:all .2s;margin-left:48px;margin-top:20px}
.back-link:hover{color:var(--accent2);border-color:rgba(79,124,255,.4);background:var(--adim)}

/* Responsive */
@media(max-width:768px){
  .hero{padding:24px 20px 16px}
  .machine-tabs{padding:0 20px 16px}
  .sensor-display{padding:0 20px 32px}
  .sensor-grid{grid-template-columns:1fr}
  .machine-header{flex-wrap:wrap}
  .mh-stats{margin-left:0;margin-top:8px}
}
</style>
</head>
<body>
<div class="app">

<header class="topbar">
  <div class="topbar-logo">
    <div class="logo-mark">IIQ</div>
    <div>
      <div class="logo-name">Industrial<span>IQ</span></div>
      <div class="logo-sub">PREDICTIVE MAINTENANCE SYSTEM</div>
    </div>
  </div>
  <div class="topbar-nav">
    <a href="/" class="nav-tab">Overview</a>
    <a href="/sensors" class="nav-tab active">Sensors</a>
    <a href="/reports" class="nav-tab">Reports</a>
    <a href="/reports" class="nav-tab">History</a>
  </div>
  <div class="topbar-right">
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
      <div class="theme-toggle-knob"></div>
      <span class="theme-toggle-icon moon">🌙</span>
      <span class="theme-toggle-icon sun">☀️</span>
    </button>
  </div>
</header>

<div class="main-content">
  <div class="hero">
    <div class="hero-title">🔬 <span>Sensor Encyclopedia</span></div>
    <div class="hero-sub">Explore every sensor across all machines — understand what each sensor monitors,<br>why it matters, and how it keeps your factory running safely.</div>
  </div>

  <div class="machine-tabs" id="machine-tabs"></div>

  <div class="sensor-display" id="sensor-display"></div>
</div>

</div>

<script>
const MACHINES = {
  "Conveyor Belt": {
    icon: "🔄", desc: "Industrial material transport conveyor system",
    sensors: [
      {icon:"🌡️",name:"Motor Temperature",type:"temp",unit:"°C",purpose:"Monitors the conveyor motor temperature.",importance:["Prevents motor overheating.","Detects excessive load on the conveyor."]},
      {icon:"📳",name:"Vibration",type:"vib",unit:"mm/s",purpose:"Measures vibration from the motor and rollers.",importance:["Detects bearing wear.","Identifies loose or damaged components."]},
      {icon:"⚡",name:"Drive Current",type:"current",unit:"A",purpose:"Measures electrical current used by the conveyor motor.",importance:["Indicates motor workload.","Detects overload conditions."]},
      {icon:"🔄",name:"Drive RPM",type:"rpm",unit:"RPM",purpose:"Measures motor rotational speed.",importance:["Ensures proper belt movement.","Detects motor or gearbox problems."]},
      {icon:"⚖️",name:"Load Weight",type:"weight",unit:"kg",purpose:"Measures material weight on the conveyor.",importance:["Prevents overloading.","Maintains safe operation."]}
    ]
  },
  "Air Compressor": {
    icon: "💨", desc: "Industrial reciprocating / screw air compressor",
    sensors: [
      {icon:"🌡️",name:"Discharge Temperature",type:"temp",unit:"°C",purpose:"Monitors compressed air temperature.",importance:["Prevents overheating.","Protects compressor components."]},
      {icon:"📳",name:"Vibration",type:"vib",unit:"mm/s",purpose:"Measures compressor vibration.",importance:["Detects bearing wear.","Identifies mechanical faults."]},
      {icon:"🛢️",name:"Outlet Pressure",type:"pressure",unit:"bar",purpose:"Measures compressed air pressure.",importance:["Ensures sufficient air supply.","Detects leaks or pressure issues."]},
      {icon:"⚡",name:"Motor Current",type:"current",unit:"A",purpose:"Measures compressor motor current.",importance:["Monitors motor load.","Detects overload conditions."]},
      {icon:"🔄",name:"Motor RPM",type:"rpm",unit:"RPM",purpose:"Measures compressor motor speed.",importance:["Ensures efficient compressor operation.","Detects motor performance issues."]},
      {icon:"🛢️",name:"Oil Pressure",type:"pressure",unit:"bar",purpose:"Monitors lubrication pressure.",importance:["Protects moving parts.","Prevents excessive wear."]}
    ]
  },
  "Hydraulic Press": {
    icon: "🔩", desc: "High-force hydraulic forming and stamping press",
    sensors: [
      {icon:"🌡️",name:"Oil Temperature",type:"temp",unit:"°C",purpose:"Measures hydraulic oil temperature.",importance:["Prevents oil degradation.","Maintains hydraulic efficiency."]},
      {icon:"🛢️",name:"System Pressure",type:"pressure",unit:"bar",purpose:"Measures hydraulic pressure.",importance:["Ensures proper pressing force.","Detects leaks or blockages."]},
      {icon:"📳",name:"Vibration",type:"vib",unit:"mm/s",purpose:"Monitors machine vibration.",importance:["Detects pump or mechanical issues.","Prevents unexpected failures."]},
      {icon:"⚡",name:"Pump Current",type:"current",unit:"A",purpose:"Measures hydraulic pump current.",importance:["Indicates pump workload.","Detects overload conditions."]},
      {icon:"🔄",name:"Cycle Rate",type:"rpm",unit:"cyc/min",purpose:"Measures pressing cycles per minute.",importance:["Monitors production speed.","Detects operational abnormalities."]},
      {icon:"🛢️",name:"Oil Level",type:"flow",unit:"%",purpose:"Measures hydraulic oil quantity.",importance:["Prevents pump damage.","Ensures smooth operation."]}
    ]
  },
  "Industrial Pump": {
    icon: "🌀", desc: "Centrifugal / positive displacement industrial pump",
    sensors: [
      {icon:"🌡️",name:"Bearing Temperature",type:"temp",unit:"°C",purpose:"Measures bearing temperature.",importance:["Prevents bearing failure.","Detects lubrication issues."]},
      {icon:"📳",name:"Vibration",type:"vib",unit:"mm/s",purpose:"Measures pump vibration.",importance:["Detects imbalance and misalignment.","Identifies bearing wear."]},
      {icon:"🛢️",name:"Discharge Pressure",type:"pressure",unit:"bar",purpose:"Measures pump outlet pressure.",importance:["Ensures proper fluid delivery.","Detects blockages and leaks."]},
      {icon:"💧",name:"Flow Rate",type:"flow",unit:"m³/h",purpose:"Measures liquid flow through the pump.",importance:["Ensures efficient pumping.","Detects reduced performance."]},
      {icon:"🔄",name:"Impeller RPM",type:"rpm",unit:"RPM",purpose:"Measures impeller rotational speed.",importance:["Maintains pump efficiency.","Detects motor issues."]},
      {icon:"⚡",name:"Motor Current",type:"current",unit:"A",purpose:"Measures motor electrical load.",importance:["Detects overload conditions.","Monitors motor health."]}
    ]
  },
  "Lathe Machine": {
    icon: "🔧", desc: "Industrial engine lathe / CNC turning center",
    sensors: [
      {icon:"🔄",name:"Spindle RPM",type:"rpm",unit:"RPM",purpose:"Measures spindle speed.",importance:["Ensures accurate machining.","Maintains product quality."]},
      {icon:"🌡️",name:"Bearing Temperature",type:"temp",unit:"°C",purpose:"Measures spindle bearing temperature.",importance:["Prevents bearing damage.","Detects excessive friction."]},
      {icon:"📳",name:"Vibration",type:"vib",unit:"mm/s",purpose:"Measures machine vibration.",importance:["Detects spindle imbalance.","Identifies mechanical wear."]},
      {icon:"⚡",name:"Spindle Current",type:"current",unit:"A",purpose:"Measures spindle motor current.",importance:["Monitors cutting load.","Detects overload conditions."]},
      {icon:"📏",name:"Feed Rate",type:"speed",unit:"mm/min",purpose:"Measures tool movement speed.",importance:["Ensures machining accuracy.","Maintains surface finish quality."]}
    ]
  },
  "Milling Machine": {
    icon: "⚒️", desc: "Vertical / horizontal CNC milling machining center",
    sensors: [
      {icon:"🔄",name:"Spindle RPM",type:"rpm",unit:"RPM",purpose:"Measures spindle rotational speed.",importance:["Ensures proper cutting performance.","Maintains machining precision."]},
      {icon:"🌡️",name:"Spindle Temperature",type:"temp",unit:"°C",purpose:"Measures spindle temperature.",importance:["Prevents overheating.","Protects spindle components."]},
      {icon:"📳",name:"Vibration",type:"vib",unit:"mm/s",purpose:"Measures machine vibration.",importance:["Detects tool wear.","Identifies spindle issues."]},
      {icon:"⚡",name:"Spindle Current",type:"current",unit:"A",purpose:"Measures spindle motor current.",importance:["Monitors cutting load.","Detects overload conditions."]},
      {icon:"💧",name:"Coolant Flow",type:"flow",unit:"L/min",purpose:"Measures coolant supply rate.",importance:["Prevents tool overheating.","Improves machining quality."]},
      {icon:"⚖️",name:"Cutting Force",type:"weight",unit:"N",purpose:"Measures force applied during cutting.",importance:["Detects excessive cutting load.","Helps prevent tool breakage."]}
    ]
  }
};

let activeMachine = null;

function toggleTheme(){
  const h=document.documentElement;
  h.dataset.theme = h.dataset.theme==='dark'?'light':'dark';
  localStorage.setItem('iiq-theme',h.dataset.theme);
}
(function(){const t=localStorage.getItem('iiq-theme');if(t)document.documentElement.dataset.theme=t})();

function buildTabs(){
  const c=document.getElementById('machine-tabs');
  let h='';
  Object.entries(MACHINES).forEach(([name,m],i)=>{
    h+=`<button class="machine-tab${i===0?' active':''}" data-machine="${name}" onclick="selectMachine('${name}')">
      <span class="mt-ico">${m.icon}</span>
      <span class="mt-name">${name}</span>
      <span class="mt-cnt">${m.sensors.length} SENSORS</span>
    </button>`;
  });
  c.innerHTML=h;
}

function selectMachine(name){
  activeMachine=name;
  document.querySelectorAll('.machine-tab').forEach(t=>{
    t.classList.toggle('active',t.dataset.machine===name);
  });
  renderSensors(name);
}

function renderSensors(name){
  const m=MACHINES[name];
  const d=document.getElementById('sensor-display');
  let h=`<div class="machine-header">
    <div class="mh-icon">${m.icon}</div>
    <div class="mh-info">
      <h2>${name}</h2>
      <p>${m.desc}</p>
    </div>
    <div class="mh-stats">
      <div class="mh-stat">
        <div class="mh-stat-val">${m.sensors.length}</div>
        <div class="mh-stat-lbl">SENSORS</div>
      </div>
      <div class="mh-stat">
        <div class="mh-stat-val">${new Set(m.sensors.map(s=>s.type)).size}</div>
        <div class="mh-stat-lbl">TYPES</div>
      </div>
    </div>
  </div>
  <div class="sensor-grid">`;

  m.sensors.forEach(s=>{
    h+=`<div class="sensor-card">
      <div class="sc-header">
        <div class="sc-icon ${s.type}">${s.icon}</div>
        <div>
          <div class="sc-title">${s.name}</div>
          <div class="sc-unit">Unit: ${s.unit}</div>
        </div>
      </div>
      <div class="sc-body">
        <div class="sc-purpose">
          <div class="sc-purpose-lbl">Purpose</div>
          <div class="sc-purpose-txt">${s.purpose}</div>
        </div>
        <div class="sc-importance">
          <div class="sc-imp-lbl">Why It's Important</div>
          ${s.importance.map(imp=>`<div class="sc-imp-item"><span class="sc-imp-dot"></span>${imp}</div>`).join('')}
        </div>
      </div>
    </div>`;
  });

  h+='</div>';
  d.innerHTML=h;
}

document.addEventListener('DOMContentLoaded',()=>{
  buildTabs();
  const first=Object.keys(MACHINES)[0];
  selectMachine(first);
});
</script>
</body>
</html>
